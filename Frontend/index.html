<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante CUCHARA REBELDE - SENA ADSO</title>

    <!-- Estilos CSS Personalizados -->
    <link rel="stylesheet" href="styless.css">

    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">

        <!-- Encabezado -->
        <header class="header">
            <h1><i class="fa-solid fa-list-check"></i> Restaurante CUCHARA REBELDE</h1>
        </header>

        <!-- Formulario de Creación -->
        <section class="card form-card">
            <h2><i class="fa-solid fa-plus-circle"></i> Nuevo plato</h2>

            <form id="form-tarea">
                <div class="form-group">
                    <label for="titulo">Nombre del plato <span class="required">*</span></label>
                    <input
                        type="text"
                        id="nombre_plato"
                        placeholder="Ej. Cocido Boyacense"
                        required
                        minlength="3"
                        maxlength="150"
                    >
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="" disabled selected>Selecciona una categoria</option>
                        <option value="sopas y sancochos">Sopas y Sancochos</option>
                        <option value="Platos tipicos">Platos tipicos</option>
                        <option value="Entradas y Amasijos">Entradas y Amasijos</option>
                        <option value="Postres y Bebidas">Postres y Bebidas</option>
                    </select>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio (COP) <span class="required">*</span></label>
                        <input 
                        type="number"
                        id="precio"
                        placeholder="Ej. $20.000"
                        required
                        min="1"
                        >
                    </div>

                    <div class="form-group">
                        <label for="disponible_hoy">
                            <input type="checkbox" id="disponible_hoy" checked>
                            Disponible hoy en el menu
                        </label>
                    </div>

                    
            </form>
        </section>
