<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante CUCHARA REBELDE - SENA ADSO</title>

    <link rel="stylesheet" href="css/styless.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="nav">
    <div class="navbar">

        <img class="navbar_logo"
             src="img/cuchara_rebelde.png"
             alt="Logo de Cuchara Rebelde">

        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="menu.html" class="activo">Menú</a>
            <a href="nuevo_plato.html">Nuevo plato</a>
        </nav>

    </div>
    </header>

    <div class="container">

        <!-- Formulario de creación / edición -->
        <section class="card form-card">
            <h2 id="titulo-form"><i class="fa-solid fa-plus-circle"></i> Nuevo plato</h2>

            <form id="form-plato">
                <div class="form-group">
                    <label for="nombre_plato">Nombre del plato <span class="required">*</span></label>
                    <input type="text" id="nombre_plato" placeholder="Ej. Cocido Boyacense"
                           required minlength="3" maxlength="150">
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría <span class="required">*</span></label>
                    <select id="categoria" required>
                        <option value="" disabled selected>Selecciona una categoría</option>
                        <option value="Sopas y Sancochos">Sopas y Sancochos</option>
                        <option value="Platos Tipicos">Platos Típicos</option>
                        <option value="Entradas y Amasijos">Entradas y Amasijos</option>
                        <option value="Postres y Bebidas">Postres y Bebidas</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="precio">Precio (COP) <span class="required">*</span></label>
                    <input type="number" id="precio" placeholder="Ej. 20000" required min="1" step="1">
                </div>

                <div class="form-group">

                <label for="imagen_url">URL de la imagen del plato</label>
                <input
                   type="url"
                   id="imagen_url"
                  placeholder="https://ejemplo.com/imagen.jpg"
                >

                <div id="vista-previa-contenedor" hidden>
                   <p>Vista previa:</p>
                   <img
                      id="vista-previa"
                      alt="Vista previa del plato"
                      style="width: 180px; height: 180px; object-fit: cover; border-radius: 10px;"
                    >
                </div>
                </div>

                <div class="form-group">
                    <label for="disponible_hoy">
                        <input type="checkbox" id="disponible_hoy" checked>
                        Disponible hoy en el menú
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-guardar" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar plato
                    </button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary" hidden>
                        <i class="fa-solid fa-xmark"></i> Cancelar edición
                    </button>
                </div>
            </form>

            <p id="mensaje" class="mensaje" hidden></p>
        </section>

    </div>

    <script src="app.js"></script>
</body>
</html>
